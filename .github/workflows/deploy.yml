name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # index.html carries every line of the budget app's logic and has no unit
      # tests. A parse error there white-screens the whole app, so at minimum
      # refuse to ship one.
      - name: Check index.html scripts parse
        run: |
          node -e "
          const fs=require('fs'), vm=require('vm');
          const h=fs.readFileSync('index.html','utf8');
          const blocks=h.match(/<script(?![^>]*src=)[^>]*>[\s\S]*?<\/script>/g)||[];
          if(!blocks.length){ console.error('no inline script blocks found — check the matcher'); process.exit(1); }
          let bad=0;
          blocks.forEach((b,i)=>{
            const src=b.replace(/^<script[^>]*>/,'').replace(/<\/script>$/,'');
            try{ new vm.Script(src); }
            catch(e){ bad++; console.error('block '+i+': '+e.message); }
          });
          if(bad){ console.error(bad+' script block(s) failed to parse'); process.exit(1); }
          console.log(blocks.length+' script blocks parsed clean');
          "

      - name: Test personal app
        run: node --test scripts/personal-app.test.cjs

      - name: Inject Supabase anon key
        env:
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          node -e "
          const fs=require('fs');
          const key=(process.env.SUPABASE_ANON||'').trim();
          if(!key){ console.error('SUPABASE_ANON secret is empty — refusing to ship a non-functional app'); process.exit(1); }
          let h=fs.readFileSync('index.html','utf8');
          const n=(h.match(/__SUPABASE_ANON__/g)||[]).length;
          if(n===0){ console.error('placeholder __SUPABASE_ANON__ not found in index.html'); process.exit(1); }
          h=h.replace(/__SUPABASE_ANON__/g,key);
          fs.writeFileSync('index.html',h);
          console.log('injected into '+n+' site(s)');
          "

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Build advisor app
        working-directory: advisor-app
        env:
          VITE_SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: |
          npm ci
          npm run test
          npm run build

      # Publish an explicit allow-list. `path: '.'` previously shipped the whole
      # checkout to Pages — including advisor-app/node_modules (~200 MB), the
      # advisor source, the audit harness, edge-function source and internal docs.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.json _site/
          cp -r assets _site/
          cp -r advisor _site/advisor
          touch _site/.nojekyll
          du -sh _site
          find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment

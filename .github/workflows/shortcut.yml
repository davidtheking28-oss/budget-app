name: Sign shortcut
on:
  push:
    branches: [shortcut-build]
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sw_vers
          python3 scripts/build-shortcut.py shekel.unsigned.shortcut
          plutil -lint shekel.unsigned.shortcut
          shortcuts sign --help || true
          shortcuts sign --mode anyone --input shekel.unsigned.shortcut --output shekel.shortcut || echo "SIGN_FAILED $?"
          ls -la *.shortcut
          head -c 4 shekel.shortcut | xxd || true
      - uses: actions/upload-artifact@v4
        with:
          name: shortcut
          path: "*.shortcut"

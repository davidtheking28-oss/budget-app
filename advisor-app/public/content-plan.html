<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>לוח תוכן 4 שבועות</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* layout: compact header + sticky tab bar; one tab visible at a time (לוח / רעיונות / נוסחה / פרופיל); script opens in a side sheet */
:root{--bg:#F4F7FD;--card:#FFFFFF;--fg:#0B1F44;--mute:#5A6B8F;--line:#DCE4F4;--accent:#2457E6;--on-accent:#FFFFFF;--tint:#EAF0FF;--value:#0B8F6B;--on-value:#FFFFFF;--vtint:#E4F5EE;--warn:#B45309;--scrim:rgba(11,31,68,.45);--font-d:'Rubik',Arial,sans-serif;--font-b:'Assistant',Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1226;--card:#111C3A;--fg:#EAF0FF;--mute:#9DB0DB;--line:#24355F;--accent:#7FA8FF;--on-accent:#0A1226;--tint:#16254D;--value:#4FD1A5;--on-value:#0A1226;--vtint:#0F2A2E;--warn:#FBBF24;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1226;--card:#111C3A;--fg:#EAF0FF;--mute:#9DB0DB;--line:#24355F;--accent:#7FA8FF;--on-accent:#0A1226;--tint:#16254D;--value:#4FD1A5;--on-value:#0A1226;--vtint:#0F2A2E;--warn:#FBBF24;--scrim:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:18px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1040px;margin:0 auto;padding-block:28px 72px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5.5vw,40px);line-height:1.1}
h2{font-size:24px}
h3{font-size:19px}
p{margin:0}
.mute{color:var(--mute)}
.top{display:flex;flex-direction:column;gap:10px}
.prog{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar{flex:1 1 200px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.prog b{font-family:var(--font-d);font-size:16px;font-variant-numeric:tabular-nums}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{flex:none;font-family:var(--font-d);font-size:16px;font-weight:500;border:0;background:transparent;color:var(--mute);padding:8px 16px;border-radius:99px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tab:focus-visible,.open:focus-visible,.x:focus-visible,.chip:focus-visible,.done-box input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
ul,ol{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.now{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.now ol{gap:8px}
.now li b{font-family:var(--font-d)}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rule{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.rule b{font-family:var(--font-d);font-size:19px;color:var(--accent)}
.rule span{color:var(--mute);font-size:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:15px;align-items:center}
.week{display:flex;flex-direction:column;gap:10px}
.whead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.whead .goal{color:var(--mute);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.cards{grid-template-columns:minmax(0,1fr)}}
.c{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:12px 14px;min-width:0}
.c.v{border-top-color:var(--value)}
.c .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day{font-family:var(--font-d);font-weight:500;font-size:15px}
.day small{color:var(--mute);font-weight:400;font-size:13px;margin-inline-start:6px}
.done-box{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);cursor:pointer}
.done-box input{width:18px;height:18px;accent-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--font-d);font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--accent)}
.v .tag.k{background:var(--vtint);color:var(--value)}
.tag.f{background:transparent;color:var(--mute);border:1px solid var(--line)}
.t{font-family:var(--font-d);font-weight:500;font-size:17px;line-height:1.3;text-wrap:balance}
.fm{font-size:14px;color:var(--mute)}
.need{font-size:13px;font-family:var(--font-d);color:var(--warn)}
.nt{font-size:14px;color:var(--mute)}
.open{margin-top:auto;align-self:stretch;font-family:var(--font-d);font-size:15px;font-weight:500;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:var(--on-accent);cursor:pointer}
.v .open{background:var(--value);color:var(--on-value)}
.c.done{opacity:.5}
.c.done .t{text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
@media (max-width:600px){.chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{flex:none}}
.chip{font-family:var(--font-d);font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.bgrp{display:flex;flex-direction:column;gap:8px}
.bgrp h3 small{font-family:var(--font-b);font-weight:400;font-size:14px;color:var(--mute);margin-inline-start:8px}
.bitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.bi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.bi.top{border:2px solid var(--accent)}
.bi b{font-family:var(--font-d);font-size:17px}
.bi .o{font-size:16px;background:var(--bg);border-radius:8px;padding:8px 10px}
.bi .by{font-size:14px;color:var(--mute)}
.bi .fl{font-size:13px;font-family:var(--font-d);color:var(--warn)}
.star{color:var(--accent)}
.gd{display:flex;flex-direction:column;gap:8px}
.gr{display:grid;grid-template-columns:76px 1fr;gap:4px 12px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:8px}
.gr b{font-family:var(--font-d);font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.gr .m{font-size:14px;color:var(--mute)}
.kw{display:inline-block;align-self:flex-start;font-family:var(--font-d);font-size:13px;background:var(--tint);color:var(--accent);border-radius:99px;padding:2px 10px}
.sl summary{cursor:pointer;font-family:var(--font-d);font-size:14px;color:var(--accent)}
.sl ol{margin-top:8px;font-size:15px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.idea{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.idea b{font-family:var(--font-d)}
.idea .n{font-family:var(--font-d);font-size:22px;color:var(--accent);font-variant-numeric:tabular-nums}
.idea span{font-size:16px}
.idea em{font-style:normal;color:var(--mute);font-size:14px}
.note{color:var(--mute);font-size:16px}
.bio{background:var(--tint);border-radius:10px;padding:12px 14px;line-height:1.6}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:10}
.sheet{position:fixed;top:0;bottom:0;right:0;width:min(560px,100%);background:var(--card);z-index:11;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.25);padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet .sh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:22px;line-height:1;cursor:pointer}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--mute)}
.blk{display:flex;flex-direction:column;gap:8px}
.blk h4{font-size:15px;color:var(--mute)}
.line{border-radius:10px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.line.x1{background:var(--tint)}
.line .k{font-family:var(--font-d);font-size:12px;font-weight:500;color:var(--accent)}
.line.f1 .k{color:var(--mute)}
.line .s{font-size:14px;color:var(--mute)}
.slides li{background:var(--bg);border-radius:10px;padding:10px 12px;list-style:none;margin-inline-start:-22px}
.slides li b{font-family:var(--font-d);color:var(--accent);margin-inline-end:8px}
.cap{background:var(--tint);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
body{font-size:var(--t-md,.94rem);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:800;letter-spacing:-.02em;line-height:1.2}
h1{font-size:var(--t-xl,1.3rem)}
h2{font-size:var(--t-lg,1.05rem)}
h3{font-size:var(--t-md,.94rem)}
.wrap{gap:20px}
.top{gap:6px}
.top p,.note,.mute{font-size:var(--t-base,.86rem)}
.prog b{font-size:var(--t-base,.86rem);font-weight:800}
.tabs{gap:4px}
.tab{font-size:var(--t-base,.86rem);font-weight:700;padding:7px 14px}
.box,.now{border-radius:var(--r-md,18px);padding:20px;border-width:1px}
.rule,.c,.bi,.idea{border-radius:var(--r-sm,12px)}
.now li b,.bi b,.idea b{font-weight:800}
.rules{gap:12px}
.rule b{font-size:var(--t-lg,1.05rem);font-weight:800}
.rule span,.legend,.whead .goal,.fm,.nt,.bi .by,.idea em,.line .s,.gr .m,.meta{font-size:var(--t-sm,.8rem)}
.need,.tag,.kw,.bi .fl,.line .k,.day small,.done-box,.sl summary{font-size:var(--t-xs,.74rem)}
.tag,.kw,.need,.line .k{font-weight:700}
.chip{font-size:var(--t-sm,.8rem);font-weight:700}
.day{font-size:var(--t-base,.86rem);font-weight:700}
.t{font-size:var(--t-md,.94rem);font-weight:800;letter-spacing:-.01em}
.open{font-size:var(--t-sm,.8rem);font-weight:700;border-radius:var(--r-sm,12px);min-height:34px}
.bi b{font-size:var(--t-md,.94rem)}
.bi .o,.idea span,.sl ol,.bio,.line,.cap{font-size:var(--t-base,.86rem)}
.gr b,.idea .n{font-size:var(--t-lg,1.05rem);font-weight:800}
.bgrp h3 small{font-size:var(--t-sm,.8rem)}
.sheet{font-size:var(--t-base,.86rem)}
.x{border-radius:50%}
</style>
<div id="app" dir="rtl"></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT" dir="rtl"></aside>
<script src="content-plan.js"></script>
